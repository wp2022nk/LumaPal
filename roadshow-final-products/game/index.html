<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滴滴的云朵大冒险</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:#163633;background:#ecf7f2}
button{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.stage{position:relative;overflow:hidden;min-height:100vh;background:linear-gradient(#8fd7ff 0%,#eaf8ff 58%,#ccecc2 58%,#75bf75 100%)}
.cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.86);filter:drop-shadow(0 12px 22px rgba(44,97,111,.15))}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.c1{left:6%;top:10%;width:230px;height:80px}.c1:before{left:35px;top:-42px;width:95px;height:95px}.c1:after{right:26px;top:-28px;width:72px;height:72px}
.c2{right:8%;top:22%;width:300px;height:92px}.c2:before{left:48px;top:-50px;width:110px;height:110px}.c2:after{right:38px;top:-32px;width:82px;height:82px}
.rain{position:absolute;inset:0;pointer-events:none;opacity:.6}
.rain i{position:absolute;top:-40px;width:12px;height:20px;border-radius:50% 50% 60% 60%;background:#31aee8;animation:rain 1.8s linear infinite}
.rain i:nth-child(1){left:18%;animation-delay:.1s}.rain i:nth-child(2){left:31%;animation-delay:.7s}.rain i:nth-child(3){left:56%;animation-delay:.3s}.rain i:nth-child(4){left:74%;animation-delay:1.1s}
@keyframes rain{to{top:88%;opacity:0}}
.play{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.panel{width:min(820px,94vw);min-height:620px;padding:28px;border-radius:8px;background:rgba(255,255,255,.82);box-shadow:0 24px 68px rgba(26,84,94,.23);border:1px solid rgba(255,255,255,.8)}
.kicker{margin:0 0 8px;color:#5b786f;font-weight:700}
h1{margin:0;color:#114d48;font-size:34px;line-height:1.2}
.story{margin:12px 0 18px;color:#385e58;line-height:1.8;font-size:17px}
.visual{height:230px;display:grid;place-items:center}
.didi{position:relative;width:145px;height:178px;border-radius:55% 55% 58% 58%;background:radial-gradient(circle at 34% 24%,#fff 0 7%,transparent 8%),linear-gradient(145deg,#8cefff,#1594d5);clip-path:path("M72 0 C118 52 145 91 145 126 C145 162 115 178 72 178 C30 178 0 162 0 126 C0 91 26 52 72 0 Z");box-shadow:inset -14px -18px 25px rgba(0,74,145,.18),0 18px 34px rgba(16,96,145,.24);animation:bob 2.7s ease-in-out infinite}
.didi:before,.didi:after{content:"";position:absolute;top:78px;width:17px;height:24px;border-radius:50%;background:#123b64}.didi:before{left:43px}.didi:after{right:43px}
.mouth{position:absolute;left:61px;top:113px;width:24px;height:14px;border-radius:0 0 28px 28px;background:#6a3844}
.bag{position:absolute;left:-18px;top:94px;width:40px;height:48px;border:3px solid rgba(255,255,255,.82);border-radius:10px;background:rgba(255,255,255,.28)}
@keyframes bob{50%{transform:translateY(-12px)}}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{min-height:88px;padding:13px;border-radius:8px;border:2px solid #b9d8cf;background:#fff;color:#174e49;text-align:left;cursor:pointer;transition:.18s}
.choice:hover,.choice:focus-visible{transform:translateY(-2px);border-color:#31977f;box-shadow:0 10px 22px rgba(22,105,90,.14);outline:none}
.choice.found{border-color:#e0a246;background:#fff4d8}
.choice strong{display:block;margin-bottom:6px;font-size:17px}.choice span{color:#5b706c;line-height:1.5}
.feedback{margin-top:16px;min-height:76px;padding:14px 16px;border-radius:8px;background:#f3fbf7;color:#254f49;line-height:1.7}
.primary{margin-top:14px;padding:11px 18px;border:0;border-radius:8px;color:white;background:#17645e;cursor:pointer}.hidden{display:none}
.sun-task{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;margin-top:18px}.sun-btn{min-height:118px;border:0;border-radius:8px;background:linear-gradient(145deg,#ffe38c,#f0a83b);font-size:44px;cursor:pointer;box-shadow:0 12px 24px rgba(211,137,32,.24)}.sun-btn small{display:block;margin-top:8px;font-size:16px;color:#5b3d08}.sun-drop{min-height:118px;display:grid;place-items:center;border:2px dashed #9bcfc5;border-radius:8px;color:#17645e;background:#f5fffb}.sun-drop strong{font-size:18px}@media(max-width:620px){.sun-task{grid-template-columns:1fr}}
.hud{padding:24px;background:#fffdf5;border-left:1px solid #d5e5de}
.hud h2{margin:0 0 12px;color:#174f4b}.progress{height:10px;border-radius:999px;background:#dce9e5;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:linear-gradient(90deg,#2aa383,#e0a246);transition:.25s}
.badge{margin:10px 0;padding:12px;border-radius:8px;background:#edf7f3;color:#59706c}.badge.earned{background:#fff1d9;color:#76500d;font-weight:700}
.log{margin-top:18px;padding:14px;border-radius:8px;background:#f5f7f4;color:#526d68;line-height:1.65}
@media(max-width:900px){.app{grid-template-columns:1fr}.hud{border-left:0}.panel{min-height:auto}.choices{grid-template-columns:1fr}.visual{height:190px}h1{font-size:28px}}
</style>
</head>
<body>
<main class="app">
  <section class="stage">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="rain"><i></i><i></i><i></i><i></i></div>
    <div class="play">
      <section class="panel" aria-live="polite">
        <p class="kicker" id="chapter">水循环闯关游戏</p>
        <h1 id="title">滴滴的云朵大冒险</h1>
        <p class="story" id="story">帮助小水滴滴滴完成从茶杯到天空、从云朵到花园、再回到天空的旅程。</p>
        <div class="visual"><div class="didi"><span class="mouth"></span><span class="bag"></span></div></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback">选择一个答案，开始冒险。</div>
        <button class="primary hidden" id="next">继续</button>
      </section>
    </div>
  </section>
  <aside class="hud">
    <h2>冒险进度</h2>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="badge" id="b0">水循环侦探</div>
    <div class="badge" id="b1">云朵守护者</div>
    <div class="badge" id="b2">水循环探险家</div>
    <div class="log" id="log">目标：记住水从水滴、水蒸气、云、雨，再回到地面的旅行路线。</div>
  </aside>
</main>
<script>
const steps=[
{chapter:"第一关：帮助滴滴回家",title:"滴滴要先去哪里？",story:"茶杯变热了，滴滴变成轻轻的水蒸气，正往上飘。它应该先去哪里集合？",choices:[["云朵王国","和许多小水滴朋友集合",true,"答对了。水蒸气会飘到天空，在云朵里和许多小水滴集合。"],["冰雪城堡","冷冷的地方",false,"冰雪城堡也和水有关，但滴滴现在已经变成水蒸气，要先去云朵王国。"],["太阳能量站","继续加热",false,"太阳会给滴滴能量，不过现在它要先飞进云朵里。"]],badge:0,log:"茶杯的热让水变成水蒸气，滴滴飞向云朵王国。"},
{chapter:"记忆小问答",title:"茶杯为什么能让滴滴飞起来？",story:"回想刚才的观察：热茶上方的白雾像一条小路，是什么让小水滴变轻、变成水蒸气？",choices:[["因为水变热了","热让水变成气往上飘",true,"完全正确。加热会让水蒸发，变成看不见或白白的水蒸气。"],["因为水睡醒了","水睡醒不是科学原因",false,"这个说法很可爱，但真正原因是水被加热了。"],["因为杯子会唱歌","唱歌不是蒸发原因",false,"杯子也许会叮当响，不过滴滴飞起来是因为热。"]],log:"你已经能用“因为……所以……”解释蒸发。"},
{chapter:"第二关：寻找失踪的小水滴",title:"找齐 3 位小水滴朋友",story:"云朵派对要开始了，可是有三个真正的小水滴还没有到。雪花宝宝和小冰块也和水有关，但它们现在不是小水滴。",required:3,choices:[["圆圆小水滴","藏在云桥旁边",true,"找到第 1 位。圆圆的小水滴可以加入云朵派对。"],["小雨滴","正从云朵边落下来",true,"找到第 2 位。小雨滴也能继续回到云朵旅行。"],["露珠小水滴","躲在闪亮的露珠门旁",true,"找到第 3 位。三个小水滴朋友都到齐啦。"],["雪花宝宝","水冻成的漂亮样子",false,"雪花也是水变的，但它现在不是小水滴。"],["小冰块","水太冷时停住的样子",false,"冰块也是水的样子，不过现在不是云朵里的小水滴。"]],log:"滴滴分清了水、冰、雪和雨滴的不同样子。"},
{chapter:"第三关：云朵派对挑战",title:"云朵装不下了怎么办？",story:"云朵里的小水滴越来越多，白云变成胖胖的灰云。现在最适合做什么？",choices:[["继续邀请朋友","云朵会更重",false,"再邀请朋友，云朵会更装不下。"],["变成雨滴落下去","太多太重就会下雨",true,"正确。云里的小水滴太多太重，就会变成雨落下来。"],["直接飞回茶杯","旅程还没结束",false,"滴滴还要先变成雨，回到地面继续旅行。"]],badge:1,log:"滴滴和朋友们哗啦啦落下云朵，变成了雨。"},
{chapter:"第四关：雨滴降落任务",title:"滴滴落到哪里？",story:"雨滴从天空落下，下面有花园、大海和屋顶。滴滴想先去帮助最口渴的小花。",choices:[["花园","帮花朵喝水",true,"滴滴落到花瓣上，花朵喝了水，开出一朵蓝色的小星花。"],["大海","认识海浪朋友",false,"大海也可以继续水的旅行，不过这一次滴滴先去花园帮忙。"],["屋顶","顺着屋檐滑下去",false,"屋顶也会发生新故事，不过这一次滴滴先去花园帮忙。"]],log:"滴滴落到花园，帮助花朵喝水。"},
{chapter:"终极 Boss：太阳爷爷",title:"把阳光送给滴滴",story:"雨停了，太阳爷爷戴着金色王冠出现。想再次回到天空，请把阳光照到滴滴身上。",mode:"sun",badge:2,log:"完整循环：水滴 -> 水蒸气 -> 云朵 -> 雨滴 -> 地面 -> 再次蒸发。"},
{chapter:"冒险完成",title:"滴滴完成云朵大冒险",story:"滴滴从茶杯出发，到云朵王国集合，变成雨落到花园，又被太阳送回天空。水一直在旅行，永远不会停下来。",choices:[],done:true,log:"获得徽章：水循环侦探、云朵守护者、水循环探险家。"}
];
let step=0;const earned=new Set();const foundByStep={};const $=id=>document.getElementById(id);
function render(){const s=steps[step];$("chapter").textContent=s.chapter;$("title").textContent=s.title;$("story").textContent=s.story;$("choices").innerHTML="";$("next").classList.add("hidden");$("feedback").textContent=s.done?"你已经完成全部关卡，可以重新开始或复习完整路线。":s.required?`请找齐 ${s.required} 位真正的小水滴朋友。`:"请选择一个答案。";$("bar").style.width=(step/(steps.length-1)*100)+"%";[0,1,2].forEach(i=>$("b"+i).classList.toggle("earned",earned.has(i)));$("log").textContent=s.log||"";if(s.done){$("choices").innerHTML='<button class="choice" onclick="restart()"><strong>重新开始</strong><span>再帮滴滴旅行一次</span></button><button class="choice" onclick="summary()"><strong>查看路线</strong><span>复习完整水循环</span></button>';return;}if(s.mode==="sun"){renderSunTask(s);return;}s.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";if(foundByStep[step]?.has(i))b.classList.add("found");b.innerHTML=`<strong>${c[0]}</strong><span>${c[1]}</span>`;b.onclick=()=>choose(i);$("choices").appendChild(b);});}
function renderSunTask(s){$("choices").innerHTML='<div class="sun-task"><button class="sun-btn" draggable="true" id="sun">☀️<small>拖动或点击阳光</small></button><div class="sun-drop" id="sunTarget"><strong>照到滴滴身上</strong></div></div>';$("feedback").textContent="把太阳的热量给滴滴，它就能再次变成水蒸气。";const done=()=>{earned.add(s.badge);$("feedback").textContent="闯关成功。阳光照到滴滴，滴滴又变成轻轻的水蒸气，飘回天空。";$("next").classList.remove("hidden");$("next").textContent="完成冒险";[0,1,2].forEach(j=>$("b"+j).classList.toggle("earned",earned.has(j)));};$("sun").onclick=done;$("sun").ondragstart=e=>e.dataTransfer.setData("text/plain","sun");$("sunTarget").ondragover=e=>e.preventDefault();$("sunTarget").ondrop=e=>{e.preventDefault();done();};}
function choose(i){const s=steps[step],c=s.choices[i];$("feedback").textContent=c[3];if(s.required){foundByStep[step] ||= new Set();if(c[2])foundByStep[step].add(i);render();const count=foundByStep[step].size;$("feedback").textContent=count>=s.required?"三个小水滴朋友都找齐了。雪花和冰块是水的其他样子，但今天不能参加小水滴集合。":`${c[3]} 还差 ${s.required-count} 位。`;if(count>=s.required){$("next").classList.remove("hidden");$("next").textContent="继续";}return;}if(c[2]){if(s.badge!==undefined)earned.add(s.badge);$("next").classList.remove("hidden");$("next").textContent=step===steps.length-2?"完成冒险":"继续";}[0,1,2].forEach(j=>$("b"+j).classList.toggle("earned",earned.has(j)));}
$("next").onclick=()=>{step=Math.min(step+1,steps.length-1);render();};
function restart(){step=0;earned.clear();Object.keys(foundByStep).forEach(k=>delete foundByStep[k]);render();}
function summary(){$("feedback").textContent="完整路线：茶杯加热 -> 水蒸气 -> 云朵集合 -> 小水滴太多变成雨 -> 落到花园 -> 太阳加热再次飞回天空。";}
render();
</script>
</body>
</html>
