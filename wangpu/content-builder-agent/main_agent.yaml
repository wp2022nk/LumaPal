# Main general-purpose content builder configuration.
# Add domain capabilities through skills and tools rather than embedding them in AGENTS.md.

name: content-builder

model:
  name: qwen3.6-plus
  env_model: QWEN_TEXT_MODEL
  env_api_key: QWEN_API_KEY
  env_base_url: QWEN_BASE_URL
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  enable_thinking: true
  thinking_budget: 4096

system_prompt_file: AGENTS.md
memory:
  - /wangpu/content-builder-agent/AGENTS.md

skills:
  - /wangpu/content-builder-agent/skills/

tools:
  - generate_image

subagents_config: subagents.yaml

backend:
  type: local_shell
  # Standard Deep Agents backend root. Generated artifacts still default to /output.
  root_dir: ../..
  virtual_mode: true
  local_shell:
    python: D:\Robort_Learn\envs\deepagents\python.exe
    allowed_commands:
      - python
      - pytest
      - node
      - npm
      - powershell
      - pwsh
      - mkdir
    require_confirmation: false
  remote:
    provider: null
    sandbox_id: null
    setup_script: null

output_root: ../../output

thread_id: content-builder-console

conversation:
  # Keep enough turns for long creative sessions to be transformed into artifacts.
  max_turns: 50
