[project]
name = "content-builder-agent"
version = "0.1.0"
description = "Deep Agents content builder CLI and LangGraph backend."
requires-python = ">=3.11,<3.12"
dependencies = [
  "deepagents==0.6.7",
  "langgraph==1.2.2",
  "langchain==1.3.2",
  "langchain-core==1.4.7",
  "langchain-openai==1.3.2",
  "langchain-qwq==0.3.5",
  "langgraph-cli[inmem]==0.4.29",
  "langgraph-api==0.10.0",
  "pyyaml==6.0.3",
  "tavily-python==0.7.25",
  "dashscope==1.25.19",
  "funasr==1.2.7",
  "torch==2.7.0",
  "torchaudio==2.7.0",
  "sounddevice==0.5.1",
  "python-multipart==0.0.20",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "uvicorn==0.48.0",
  "opuslib==3.0.1",
]

[tool.setuptools]
packages = [
  "content_builder",
  "content_builder.tools",
  "content_builder.voice",
  "content_builder.voice.asr",
  "content_builder.voice.asr.providers",
  "content_builder.voice.tts",
  "content_builder.voice.tts.providers",
  "content_builder.voice.emotion",
  "content_builder.server",
  "content_builder.server.xiaozhi",
]
